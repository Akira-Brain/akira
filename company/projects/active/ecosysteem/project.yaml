# Waarom nu en niet later: als de opportuniteit zich aandient is het te laat om het
# netwerk dan pas op te bouwen. Dat was Jasmijn's expliciete ervaring.
#
# Het risico dat erbij hoort: slecht werk van een partner straalt op ons af. Daarom
# drie modellen met verschillend gewicht - een naam doorgeven zonder garantie, een
# partner in het team trekken en zelf controleren en factureren, of commissie op
# elkaars fee. Sandrine en Emma zijn eerdere voorbeelden waar een videograaf niet
# hetzelfde kwaliteitsniveau leverde.

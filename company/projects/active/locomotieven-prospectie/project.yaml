# Locomotieven = agencies en bureaus die je binnenhalen bij hun eindklanten, in plaats van
# dat je zelf elke eindklant moet vinden. Jasmijn werkt zelf zo: creatieve agencies trekken
# haar binnen op mode- en luxeprojecten waar hun interne strategen die specialisatie missen.
#
# De discipline is het echte punt. Zonder vast moment gebeurt prospectie niet en blijf je
# op het bestaande elan doorlopen. Ritme is belangrijker dan volume: een gesprek per maand
# dat doorgaat is meer waard dan een longlist die blijft liggen.
#
# Bijkomende regel uit het gesprek: in zo'n gesprek niet alleen jezelf voorstellen maar
# vooral luisteren - waar zijn zij mee bezig, hoe ziet hun team eruit, wat is moeilijk.

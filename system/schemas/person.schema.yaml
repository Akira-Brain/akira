# person.schema.yaml - mensen: team, stagiaires, externe contacten
# Plek: {tenant}/people/{slug}.yaml
# Zone: midden risico - AI mag notes appenden, gelabeld en gedateerd.

name: Toos Franke
slug: toos-franke
type: external                  # internal | external
role: "management Selah Sue"
organization: "..."
channel_preference: email       # email | whatsapp | telefoon | slack
email: "..."                    # zakelijk contact mag; privenummers -> vault

# Alleen bij type: internal. Bepaalt wat deze persoon in de gegenereerde weergaven ziet.
# Wat elke rol betekent staat in system/access.yaml; hier staat wie hem heeft, en dit is
# de enige plek waar dat staat. Ontbreekt het veld, dan geldt `atelier` - de smalste rol,
# want standaard dicht.
toegang: atelier                # administrator | atelier

tags: [muziek, management]

notes:                          # append-only, nieuwste eerst
  - {date: 2026-08-14, text: "Reageert snel, beslist niet zelf over budget."}

# Waarom append-only: een mens verandert, maar de observatie van toen blijft nuttig.
# Corrigeren doe je door een nieuwe note toe te voegen, niet door de oude te wissen.
